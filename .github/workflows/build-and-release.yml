name: Build llama.cpp with ROCm HIP (gfx1151)

on:
  push:
    tags:
      - "b*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - ROCM_VER: '7.2.3'
            ROCM_INSTALLER_URL: https://repo.radeon.com/amdgpu-install/7.2.3/ubuntu/noble/amdgpu-install_7.2.3.70203-1_all.deb
            INSTALL_METHOD: 'deb'
            GGML_HIP_UMA: 'OFF'
            GGML_HIP_ROCWMMA_FATTN: 'OFF'
          - ROCM_VER: '7.13-nightly'
            ROCM_INSTALLER_URL: https://therock-nightly-tarball.s3.amazonaws.com/
            INSTALL_METHOD: 'tarball'
            GGML_HIP_UMA: 'ON'
            GGML_HIP_ROCWMMA_FATTN: 'ON'

    name: Build with HIP support
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      # 1 Checkout this repo
      - name: Checkout source
        uses: actions/checkout@v6
    
      - name: Set version variables
        run: |
          echo "Setting LLAMA_CPP_VER variable"
          source ./llama_cpp_version
          echo "LLAMA_CPP_VER=$LLAMA_CPP_VER" >> $GITHUB_ENV
          echo "THEROCK_TARBALL_NAME=$THEROCK_TARBALL_NAME" >> $GITHUB_ENV
          echo "ROCM_VER=${{ matrix.ROCM_VER }}" >> $GITHUB_ENV

      # 2 Install CMake + build tools
      - name: Install build tools
        run: |
          sudo add-apt-repository universe
          sudo apt update
          sudo apt-get install -y \
            cmake \
            build-essential \
            ninja-build \
            ccache \
            libcurl4-openssl-dev 
            
      # 3a Install ROCm via amdgpu-install deb (stable releases)
      - name: Install ROCm via amdgpu-install (deb)
        if: matrix.INSTALL_METHOD == 'deb'
        run: |
          wget ${{ matrix.ROCM_INSTALLER_URL }} -O amdgpu-install.deb
          sudo apt install -y ./amdgpu-install.deb
          sudo apt update
          sudo apt install -y python3-setuptools python3-wheel
          sudo usermod -a -G render,video $LOGNAME
          sudo apt install -y rocm

      # 3b Install ROCm via therock nightly tarball (beta releases)
      - name: Install ROCm via therock tarball
        if: matrix.INSTALL_METHOD == 'tarball'
        run: |
          ROCM_TARBALL_URL="${{ matrix.ROCM_INSTALLER_URL }}${THEROCK_TARBALL_NAME}"
          wget -q "$ROCM_TARBALL_URL" -O therock.tar.gz
          sudo mkdir -p /opt/rocm
          sudo tar -xzf therock.tar.gz -C /opt/rocm
          echo "/opt/rocm/bin" >> $GITHUB_PATH

      - name: Detect ROCm installation structure
        run: |
          echo "=== /opt/rocm top-level ==="
          ls /opt/rocm/
          echo "=== LLVM bin path (hipconfig -l) ==="
          /opt/rocm/bin/hipconfig -l || true
          echo "=== hipcc version ==="
          /opt/rocm/bin/hipcc --version

      # 4 Clone the official llama.cpp repo
      - name: Clone llama.cpp
        run: |
          git clone --depth 1 --branch $LLAMA_CPP_VER https://github.com/ggml-org/llama.cpp.git

      # 5 Configure & build with HIP and gfx1151
      - name: Configure and Build llama.cpp
        run: |
          cd llama.cpp
          export ROCM_PATH=/opt/rocm
          export LLVM_BIN="$(hipconfig -l)"
          export CFLAGS="-O3 -march=znver5 -mtune=znver5"
          # Strix Halo / gfx1151 needs the ROCm 7.x unroll workaround, and issue #19984
          # showed rocWMMA FATTN regresses badly on gfx115x.
          export HIP_FLAGS="--rocm-path=${ROCM_PATH} -mllvm --amdgpu-unroll-threshold-local=600"

          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${LLVM_BIN}/clang" \
            -DCMAKE_CXX_COMPILER="${LLVM_BIN}/clang++" \
            -DCMAKE_HIP_COMPILER="${LLVM_BIN}/clang" \
            -DCMAKE_HIP_FLAGS="${HIP_FLAGS}" \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_CXX_FLAGS="$CFLAGS" \
            -DGGML_HIP=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX=ON \
            -DGGML_AVX2=ON \
            -DGGML_AVX512=ON \
            -DGGML_AVX512_VBMI=ON \
            -DGGML_AVX512_VNNI=ON \
            -DGGML_BMI2=ON \
            -DGGML_FMA=ON \
            -DGGML_F16C=ON \
            -DGGML_CUDA_FA_ALL_QUANTS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DGPU_TARGETS="gfx1151" \
            -DAMDGPU_TARGETS="gfx1151" \
            -DGGML_HIP_UMA=${{ matrix.GGML_HIP_UMA }} \
            -DGGML_HIP_ROCWMMA_FATTN=${{ matrix.GGML_HIP_ROCWMMA_FATTN }}
          cmake --build build -- -j$(nproc)

      # 6 Package compiled binaries
      - name: Package artifacts
        run: |
          tar -cJf llama-cpp-${LLAMA_CPP_VER}-rocm-${ROCM_VER}-gfx1151.tar.xz -C llama.cpp/build/bin .

      # 7 Upload the built artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: llama-cpp-strix-halo-${{ matrix.ROCM_VER }}
          path: llama-cpp-*.tar.xz
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
 
      - name: Set version variables
        run: |
          echo "Setting LLAMA_CPP_VER variable"
          source ./llama_cpp_version
          echo "LLAMA_CPP_VER=$LLAMA_CPP_VER" >> $GITHUB_ENV
          echo "THEROCK_TARBALL_NAME=$THEROCK_TARBALL_NAME" >> $GITHUB_ENV

      - name: Download llama-cpp-strix-halo artifact
        uses: actions/download-artifact@v7
        with:
          pattern: llama-cpp-strix-halo-*
          path: ./release
          merge-multiple: true
      
      - name: List files
        run: |
          echo "Files to be released:"
          ls -lh ./release/
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./release/*
          body: |
            [llama.cpp ${{ env.LLAMA_CPP_VER }}](https://github.com/ggml-org/llama.cpp/releases/tag/${{ env.LLAMA_CPP_VER }}) compiled for Linux x86_64 with ROCm, optimized for AMD Strix Halo devices. Includes support for ROCm 7.2.1 and 7.13-nightly (${{ env.THEROCK_TARBALL_NAME }}), with HIP optimizations for gfx1151.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
