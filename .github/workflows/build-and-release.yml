name: Build llama.cpp with ROCm HIP (gfx1151)

on:
  push:
    tags:
      - "b*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - ROCM_VER: '7.14.1'
            ROCM_INSTALLER_URL: https://repo.radeon.com/rocm/installer/rocm-runfile-installer/rocm-rel-7.14.1/rocm-installer-7.14.1-1.run
            INSTALL_METHOD: 'runfile'
            GGML_HIP_UMA: 'ON'
            GGML_HIP_ROCWMMA_FATTN: 'OFF'
          - ROCM_VER: '10.1.0'
            ROCM_INSTALLER_URL: https://stable.repo.amd.com/rocm/core/linux-installers/rocm-installer-10.1.0-5.run
            INSTALL_METHOD: 'runfile'
            GGML_HIP_UMA: 'ON'
            GGML_HIP_ROCWMMA_FATTN: 'OFF'
          - ROCM_VER: '10.2.0'
            ROCM_INSTALLER_URL: https://stable.repo.amd.com/rocm/core/linux-installers/rocm-installer-10.2.0-5.run
            INSTALL_METHOD: 'runfile'
            GGML_HIP_UMA: 'ON'
            GGML_HIP_ROCWMMA_FATTN: 'OFF'
    name: Build with HIP support
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      # 1 Checkout this repo
      - name: Checkout source
        uses: actions/checkout@v6
    
      - name: Set version variables
        run: |
          echo "Setting LLAMA_CPP_VER variable"
          source ./llama_cpp_version
          echo "LLAMA_CPP_VER=$LLAMA_CPP_VER" >> $GITHUB_ENV
          echo "ROCM_VER=${{ matrix.ROCM_VER }}" >> $GITHUB_ENV

      # 2 Install CMake + build tools
      - name: Install build tools
        run: |
          sudo add-apt-repository universe
          sudo apt update
          sudo apt-get install -y \
            cmake \
            build-essential \
            ninja-build \
            ccache \
            libcurl4-openssl-dev 
            
      # 3a Install ROCm via amdgpu-install deb (stable releases)
      - name: Install ROCm via amdgpu-install (deb)
        if: matrix.INSTALL_METHOD == 'deb'
        run: |
          wget ${{ matrix.ROCM_INSTALLER_URL }} -O amdgpu-install.deb
          sudo apt install -y ./amdgpu-install.deb
          sudo apt update
          sudo apt install -y python3-setuptools python3-wheel
          sudo usermod -a -G render,video $LOGNAME
          sudo apt install -y rocm

      # 3c Install ROCm via the AMD runfile installer (compile-only, gfx1151-only)
      - name: Install ROCm via runfile installer
        if: matrix.INSTALL_METHOD == 'runfile'
        run: |
          wget -q "${{ matrix.ROCM_INSTALLER_URL }}" -O rocm-installer.run
          # The installer requires its target base dir to pre-exist and extracts
          # into <target>/rocm/core-<ver>, so install into a scratch base rather
          # than straight to /opt/rocm.
          sudo mkdir -p /opt/rocm-dist
          # CI compile-only: install ROCm core + dev libraries + dev tools (compiler),
          # target only gfx1151, do NOT install the amdgpu kernel driver, and run
          # post-install (postrocm) so the internal symlinks/library config are set up.
          sudo bash rocm-installer.run \
            compo=core,core-dev,dev-tools \
            gfx=gfx1151 \
            rocm \
            deps=install \
            target=/opt/rocm-dist \
            postrocm
          # Point the standard /opt/rocm path (used by the shared build steps) at the
          # versioned tree the installer produced (e.g. /opt/rocm-dist/rocm/core-7.14).
          ROCM_ROOT="$(dirname "$(dirname "$(sudo find /opt/rocm-dist -type f -name hipcc | head -1)")")"
          if [ -z "$ROCM_ROOT" ]; then
            echo "ERROR: hipcc not found under /opt/rocm-dist after install; tree was:"
            find /opt/rocm-dist -maxdepth 3 -type d | sort
            exit 1
          fi
          echo "Discovered ROCm root: $ROCM_ROOT"
          sudo ln -sfn "$ROCM_ROOT" /opt/rocm
          echo "/opt/rocm/bin" >> $GITHUB_PATH

      - name: Detect ROCm installation structure
        run: |
          echo "=== /opt/rocm top-level ==="
          ls /opt/rocm/
          echo "=== LLVM bin path (hipconfig -l) ==="
          /opt/rocm/bin/hipconfig -l || true
          echo "=== hipcc version ==="
          /opt/rocm/bin/hipcc --version

      # 4 Clone the official llama.cpp repo
      - name: Clone llama.cpp
        run: |
          git clone --depth 1 --branch $LLAMA_CPP_VER https://github.com/ggml-org/llama.cpp.git

      # 5 Configure & build with HIP and gfx1151
      - name: Configure and Build llama.cpp
        run: |
          cd llama.cpp
          export ROCM_PATH=/opt/rocm
          export LLVM_BIN="$(hipconfig -l)"
          export CFLAGS="-O3 -march=znver5 -mtune=znver5"
          # Strix Halo / gfx1151 needs the ROCm 7.x unroll workaround, and issue #19984
          # showed rocWMMA FATTN regresses badly on gfx115x.
          export HIP_FLAGS="--rocm-path=${ROCM_PATH} -mllvm --amdgpu-unroll-threshold-local=600"

          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${LLVM_BIN}/clang" \
            -DCMAKE_CXX_COMPILER="${LLVM_BIN}/clang++" \
            -DCMAKE_HIP_COMPILER="${LLVM_BIN}/clang" \
            -DCMAKE_HIP_FLAGS="${HIP_FLAGS}" \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_CXX_FLAGS="$CFLAGS" \
            -DGGML_HIP=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX=ON \
            -DGGML_AVX2=ON \
            -DGGML_AVX512=ON \
            -DGGML_AVX512_VBMI=ON \
            -DGGML_AVX512_VNNI=ON \
            -DGGML_BMI2=ON \
            -DGGML_FMA=ON \
            -DGGML_F16C=ON \
            -DGGML_CUDA_FA_ALL_QUANTS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DGPU_TARGETS="gfx1151" \
            -DAMDGPU_TARGETS="gfx1151" \
            -DGGML_HIP_UMA=${{ matrix.GGML_HIP_UMA }} \
            -DGGML_HIP_ROCWMMA_FATTN=${{ matrix.GGML_HIP_ROCWMMA_FATTN }}
          cmake --build build -- -j$(nproc)

      # 6 Package compiled binaries
      - name: Package artifacts
        run: |
          tar -cJf llama-cpp-${LLAMA_CPP_VER}-rocm-${ROCM_VER}-gfx1151.tar.xz -C llama.cpp/build/bin .

      # 7 Validate the packaged archive against the distribution contract
      #   (docs/release-validation.md). A failure here stops the archive from
      #   being uploaded, so it can never reach the release job.
      - name: Validate artifact
        run: |
          ARCHIVE="llama-cpp-${LLAMA_CPP_VER}-rocm-${ROCM_VER}-gfx1151.tar.xz"
          # The binaries record the build tree in DT_RPATH/DT_RUNPATH, and DT_RPATH
          # wins over LD_LIBRARY_PATH. Remove the tree so the loader check can only
          # resolve bundled libraries from the extracted archive.
          rm -rf llama.cpp/build
          ROCM_DETECTED="$(cat /opt/rocm/.info/version 2>/dev/null || /opt/rocm/bin/hipconfig --version 2>/dev/null || echo unknown)"
          python3 ci/validate_artifact.py validate \
            --contract ci/artifact-contract.json \
            --archive "${ARCHIVE}" \
            --upstream-tag "${LLAMA_CPP_VER}" \
            --rocm-variant "${ROCM_VER}" \
            --rocm-root /opt/rocm \
            --rocm-version-detected "${ROCM_DETECTED}" \
            --report "validation/${ARCHIVE}.validation.json" \
            --markdown "${GITHUB_STEP_SUMMARY}"

      # 8 Keep the machine-readable validation evidence, also for failed runs
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report-${{ matrix.ROCM_VER }}
          path: validation/*.json
          if-no-files-found: warn
          retention-days: 90

      # 9 Upload the built artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: llama-cpp-strix-halo-${{ matrix.ROCM_VER }}
          path: llama-cpp-*.tar.xz
          retention-days: 1

  # Runs for every build so the release gate is exercised on workflow_dispatch
  # too; only tag builds publish a GitHub Release.
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
 
      - name: Set version variables
        run: |
          echo "Setting LLAMA_CPP_VER variable"
          source ./llama_cpp_version
          echo "LLAMA_CPP_VER=$LLAMA_CPP_VER" >> $GITHUB_ENV

      - name: Download llama-cpp-strix-halo artifact
        uses: actions/download-artifact@v7
        with:
          pattern: llama-cpp-strix-halo-*
          path: ./release
          merge-multiple: true
      
      - name: Download validation reports
        uses: actions/download-artifact@v7
        with:
          pattern: validation-report-*
          path: ./validation
          merge-multiple: true

      - name: List files
        run: |
          echo "Files to be released:"
          ls -lh ./release/
          echo "Validation reports:"
          ls -lh ./validation/

      # Refuse to publish unless every expected ROCm variant is present, nothing
      # else is in ./release, and each archive has a passing validation report
      # bound to its exact bytes (sha256) and to the current contract.
      - name: Gate release on validation evidence
        run: |
          python3 ci/validate_artifact.py gate \
            --contract ci/artifact-contract.json \
            --upstream-tag "${LLAMA_CPP_VER}" \
            --archives-dir ./release \
            --reports-dir ./validation \
            --summary ./validation/release-gate.json \
            --markdown "${GITHUB_STEP_SUMMARY}"

      - name: Upload release gate summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate
          path: validation/release-gate.json
          if-no-files-found: warn
          retention-days: 90

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: ./release/*
          body: |
            [llama.cpp ${{ env.LLAMA_CPP_VER }}](https://github.com/ggml-org/llama.cpp/releases/tag/${{ env.LLAMA_CPP_VER }}) compiled for Linux x86_64 with ROCm, optimized for AMD Strix Halo devices. Includes support for ROCm 7.14.1, 10.1.0 and 10.2.0, with HIP optimizations for gfx1151.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
